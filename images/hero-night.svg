<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- Home page background: a water tanker on a city road at night -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06141c"/>
      <stop offset="0.6" stop-color="#0b2f3a"/>
      <stop offset="1" stop-color="#0f4c5c"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="120" cy="80" r="2"/><circle cx="300" cy="150" r="1.5"/><circle cx="520" cy="60" r="2"/>
    <circle cx="760" cy="120" r="1.5"/><circle cx="980" cy="70" r="2"/><circle cx="1180" cy="140" r="1.5"/>
    <circle cx="1380" cy="90" r="2"/><circle cx="1520" cy="170" r="1.5"/><circle cx="640" cy="200" r="1.2"/>
  </g>

  <!-- moon -->
  <circle cx="1350" cy="170" r="55" fill="#fef3c7" opacity="0.9"/>

  <!-- city skyline -->
  <g fill="#0a2630">
    <rect x="0" y="420" width="120" height="260"/><rect x="130" y="360" width="90" height="320"/>
    <rect x="230" y="450" width="140" height="230"/><rect x="380" y="330" width="80" height="350"/>
    <rect x="470" y="430" width="130" height="250"/><rect x="610" y="380" width="100" height="300"/>
    <rect x="720" y="470" width="150" height="210"/><rect x="880" y="350" width="90" height="330"/>
    <rect x="980" y="440" width="140" height="240"/><rect x="1130" y="390" width="100" height="290"/>
    <rect x="1240" y="460" width="160" height="220"/><rect x="1410" y="370" width="90" height="310"/>
    <rect x="1510" y="440" width="90" height="240"/>
  </g>
  <!-- lit windows -->
  <g fill="#fbbf24" opacity="0.35">
    <rect x="150" y="390" width="12" height="16"/><rect x="180" y="440" width="12" height="16"/>
    <rect x="400" y="370" width="12" height="16"/><rect x="420" y="470" width="12" height="16"/>
    <rect x="640" y="420" width="12" height="16"/><rect x="900" y="390" width="12" height="16"/>
    <rect x="930" y="500" width="12" height="16"/><rect x="1150" y="430" width="12" height="16"/>
    <rect x="1430" y="410" width="12" height="16"/><rect x="1460" y="480" width="12" height="16"/>
  </g>

  <!-- street lamps -->
  <g>
    <rect x="200" y="380" width="6" height="300" fill="#1f3b44"/><rect x="200" y="380" width="60" height="6" fill="#1f3b44"/>
    <circle cx="258" cy="392" r="70" fill="url(#glow)"/><circle cx="258" cy="390" r="7" fill="#fef3c7"/>
    <rect x="780" y="360" width="6" height="320" fill="#1f3b44"/><rect x="780" y="360" width="60" height="6" fill="#1f3b44"/>
    <circle cx="838" cy="372" r="70" fill="url(#glow)"/><circle cx="838" cy="370" r="7" fill="#fef3c7"/>
    <rect x="1360" y="380" width="6" height="300" fill="#1f3b44"/><rect x="1306" y="380" width="60" height="6" fill="#1f3b44"/>
    <circle cx="1308" cy="392" r="70" fill="url(#glow)"/><circle cx="1308" cy="390" r="7" fill="#fef3c7"/>
  </g>

  <!-- road -->
  <rect x="0" y="680" width="1600" height="220" fill="#051118"/>
  <g fill="#fbbf24" opacity="0.6">
    <rect x="40" y="790" width="110" height="8" rx="4"/><rect x="260" y="790" width="110" height="8" rx="4"/>
    <rect x="480" y="790" width="110" height="8" rx="4"/><rect x="700" y="790" width="110" height="8" rx="4"/>
    <rect x="920" y="790" width="110" height="8" rx="4"/><rect x="1140" y="790" width="110" height="8" rx="4"/>
    <rect x="1360" y="790" width="110" height="8" rx="4"/>
  </g>

  <!-- tanker truck -->
  <g transform="translate(980 520)">
    <rect x="0" y="150" width="560" height="26" rx="6" fill="#111827"/>
    <rect x="20" y="20" width="390" height="140" rx="70" fill="url(#tank)"/>
    <rect x="60" y="55" width="310" height="10" rx="5" fill="#ffffff" opacity="0.35"/>
    <text x="215" y="125" font-family="Segoe UI, Arial" font-size="34" font-weight="800"
          fill="#06303a" text-anchor="middle">PAANILINK</text>
    <path d="M425 60 h80 l50 55 v50 h-130 z" fill="#f59e0b"/>
    <path d="M445 75 h52 l32 35 h-84 z" fill="#bae6fd"/>
    <circle cx="555" cy="150" r="10" fill="#fef3c7"/>
    <circle cx="110" cy="185" r="34" fill="#030712"/><circle cx="110" cy="185" r="13" fill="#6b7280"/>
    <circle cx="320" cy="185" r="34" fill="#030712"/><circle cx="320" cy="185" r="13" fill="#6b7280"/>
    <circle cx="490" cy="185" r="34" fill="#030712"/><circle cx="490" cy="185" r="13" fill="#6b7280"/>
  </g>
  <!-- headlight beam -->
  <path d="M1545 670 L1600 640 L1600 720 Z" fill="#fde68a" opacity="0.25"/>
</svg>
